[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-oop"
version = "1.0.0"
description = "Object-oriented recommendation system (course project)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
benchmark = ["cornac>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
